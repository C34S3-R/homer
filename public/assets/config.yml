---
# Homepage configuration
# See https://fontawesome.com/search for icons options

title: "Home server"
subtitle: "Mesh"
logo: "logo.png"
icon: "fas fa-skull-crossbones" # Optional icon

header: true
footer: '<p>Created by <span class="has-text-danger">c0c0m3l0n</span> // Fork me on <a href="https://github.com/C34S3-R/homer"><i class="fab fa-github-alt"></i></a></p>' # set false if you want to hide it.

# Optional theme customization
theme: default

# Optional theme customization (color overrrides)
# overrrides can also be done using CSS vars
# Palette: Figma "Salt and pepper" (Combination 56)
#   #FFFFFF (salt) / #D4D4D4 / #B3B3B3 / #2B2B2B (pepper)
# The two intermediate grays below (#4A4A4A, #6E6E6E) are pepper tints,
# needed so white text stays readable on the header / navbar / search field.
colors:
  light:
    # pepper chrome (header, navbar, tags) on a light-gray canvas
    highlight-primary: "#2B2B2B"
    highlight-secondary: "#4A4A4A"
    highlight-hover: "#6E6E6E"
    background: "#D4D4D4"
    card-background: "#FFFFFF"
    text: "#2B2B2B"
    text-header: "#FFFFFF"
    text-title: "#2B2B2B"
    text-subtitle: "#5A5A5A"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#4A4A4A"
    link-hover: "#2B2B2B"
  dark:
    # salt canvas inverted: pepper cards, gray chrome
    highlight-primary: "#5A5A5A"
    highlight-secondary: "#4A4A4A"
    highlight-hover: "#6E6E6E"
    background: "#131313"
    card-background: "#2B2B2B"
    text: "#D4D4D4"
    text-header: "#FFFFFF"
    text-title: "#FFFFFF"
    text-subtitle: "#B3B3B3"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#D4D4D4"
    link-hover: "#FFFFFF"

# links: [] # Allows for navbar (dark mode, layout, and search) without any links
links:
  - name: "Contribute"
    icon: "fab fa-github"
    url: "https://github.com/C34S3-R/homer"
    target: "_blank" # optional html a tag target attribute
  - name: "Wiki"
    icon: "fas fa-book"
    url: "https://www.wikipedia.org/"
  # this will link to a second homer page that will load config from additional-page.yml and keep default config values as in config.yml file
  # see url field and assets/additional-page.yml.dist used in this example:
  #- name: "another page!"
  #  icon: "fas fa-file-alt"
  #  url: "#additional-page"


# Optional: enable periodic refresh for all smart cards that implements it (unless overriden at service configuration level).
updateIntervalMs: 30000 # interval in milliseconds, minimum is 1000 (1s). Remove or set to 0 to disable. Can be overriden at service level. (default disabled)

# Services
# First level array represent a group.
# Leave only a "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
services:
  - name: "Applications"
    icon: "fas fa-cloud"
    items:
      - name: "AI-Server"
        icon: "fa-solid fa-hexagon-nodes"
        subtitle: "An ai model running locally"
        tag: "qwen"
        url: "https://delllatitude-e6410.tailc3384f.ts.net:10000"
      - name: "Matatu modz"
        icon: "fa-mosaic fa-solid fa-bus"
        subtitle: "Create complete 3d models from scratch"
        tag: "Modz"
        url: "https://delllatitude-e6410.tailc3384f.ts.net:8443"
      - name: "Git streak"
        icon: "fa-solid fa-fire"
        subtitle: "An app that tracks your building collaboration with a friend"
        tag: "Streak"
        url: "https://delllatitude-e6410.tailc3384f.ts.net/"
  - name: "Media"
    icon: "fas fa-clapperboard"
    items:
      - name: "Movies"
        icon: "fa-solid fa-film"
        subtitle: "Stream your movie collection from anywhere"
        tag: "media"
        url: "https://delllatitude-e6410.tailc3384f.ts.net/jellyfin/web/"
  - name: "Server Metrics"
    icon: "fas fa-server"
    items:
      - name: "Server"
        subtitle: "Live system stats"
        type: "SysStats"
        # Same-origin backend served by server.py (GET /api/stats).
        # The service mixin appends "api/stats" to this endpoint, so it
        # must stay "" (link disabled) or "/" — never an external URL.
        url: ""
        updateIntervalMs: 3000

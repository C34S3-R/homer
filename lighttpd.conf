include_shell "/etc/lighttpd/ipv6.sh"

server.port            = env.PORT
server.modules         = ( "mod_alias", "mod_accesslog", "mod_proxy" )
server.username        = "lighttpd"
server.groupname       = "lighttpd"
server.document-root   = "/www"
alias.url              = ( env.SUBFOLDER => "/www" )
server.indexfiles      = ("index.html")
server.follow-symlink  = "enable"
server.feature-flags  += ( "server.clock-jump-restart" => 0 )
server.max-request-field-size = 65535
accesslog.filename = "/dev/fd/3" 

# Live stats for the SysStats card: same-origin /api/* is proxied to the
# homepage-stats backend on the Docker host (server.py). Keeps the card
# working without CORS or mixed-content issues. Override with
# -e STATS_HOST=... -e STATS_PORT=... if the host is reachable elsewhere.
proxy.server = ( "/api/" => ( ( "host" => env.STATS_HOST, "port" => env.STATS_PORT ) ) )

# Avoid logging docker healthcheck request
$HTTP["remote-ip"] == "127.0.0.1" { accesslog.filename = "" }
$HTTP["remote-ip"] == "[::1]" { accesslog.filename = "" }
